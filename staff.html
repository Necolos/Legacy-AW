<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Équipe Staff | LegacyAW FA RP</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* RESET & BASE */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)),
        url("images/reglement.png") no-repeat center center fixed;
      background-size: cover;
      color: #fff;
    }

    a {
      text-decoration: none;
      transition: all 0.3s ease;
    }

    /* NAVIGATION */
    .top-nav {
      position: absolute;
      top: 20px;
      right: 30px;
      display: flex;
      gap: 25px;
      z-index: 10;
    }

    .top-nav a {
      color: #fff;
      font-weight: 500;
      font-size: 0.95rem;
      opacity: 0.85;
    }

    .top-nav a:hover {
      opacity: 1;
      color: #ff8c00;
    }

    /* CONTENU PRINCIPAL */
    .content {
      max-width: 900px;
      margin: 120px auto 50px;
      text-align: center;
      padding: 0 20px;
    }

    h1 {
      font-size: 3rem;
      font-weight: 700;
      margin-bottom: 20px;
      background: linear-gradient(90deg, #ff0000, #ff8c00);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p {
      font-size: 1.2rem;
      color: #ccc;
      margin-bottom: 20px;
      line-height: 1.6;
    }

    p a {
      color: #5865F2;
      font-weight: 500;
    }

    p a:hover {
      color: #4752c4;
    }

    /* FOOTER */
    footer {
      position: absolute;
      bottom: 15px;
      width: 100%;
      text-align: center;
      font-size: 0.85rem;
      color: #777;
    }

    /* RESPONSIVE */
    @media (max-width: 768px) {
      h1 {
        font-size: 2.2rem;
      }

      .top-nav {
        flex-direction: column;
        gap: 15px;
        right: 20px;
        top: 15px;
      }

      .content {
        margin: 100px 20px 40px;
      }
    }
  </style>
</head>

<body>

  <!-- NAVIGATION -->
  <nav class="top-nav">
    <a href="index.html">Accueil</a>
    <a href="server.html">Serveur</a>

  </nav>

  </div>

  <!-- FOOTER -->
  <footer>
    © 2025 LegacyAW FA RP — Tous droits réservés
  </footer>

</body>

</html>
