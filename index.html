<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LegacyAW FA RP</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      background:
        linear-gradient(rgba(0, 0, 0, 0.65), rgba(0, 0, 0, 0.65)),
        url("images/accueil.png") no-repeat center center fixed;
      background-size: cover;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Conteneur principal */
    .page {
      width: 100%;
      max-width: 1100px;
      min-height: 100vh;
      position: relative;
      padding: 50px 20px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    /* MENU */
    .top-nav {
      position: fixed;
      top: 25px;
      right: 40px;
      display: flex;
      gap: 30px;
      z-index: 999;
    }


    .top-nav a {
      color: #ffffff;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 500;
      opacity: 0.85;
      transition: 0.2s;
    }

    .top-nav a:hover {
      opacity: 1;
      color: #ff8c00;
    }

    h1 {
      font-size: 3.5rem;
      font-weight: 700;
      margin-bottom: 20px;
      background: linear-gradient(90deg, #ff0000, #ff8c00);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p {
      font-size: 1.3rem;
      margin-bottom: 35px;
      color: #cccccc;
      max-width: 700px;
    }

    .btn-discord {
      padding: 15px 40px;
      background: #f37004;
      color: #ffffff;
      text-decoration: none;
      font-size: 1.1rem;
      font-weight: 600;
      border-radius: 40px;
      transition: 0.2s;
    }

    .btn-discord:hover {
      background: #f18119;
      transform: scale(1.05);
    }

    footer {
      position: absolute;
      bottom: 15px;
      width: 100%;
      text-align: center;
      font-size: 0.85rem;
      color: #777;
    }
  </style>
</head>

<body>

  <div class="page">

    <nav class="top-nav">
      <a href="index.html">Accueil</a>
      <a href="server.html">Serveur</a>
      <a href="reglements.html">Règlements</a>
      <a href="streamer.html">Streamer</a>
      <a href="staff.html">Équipe staff</a>
      <a href="boutique.html">Boutique</a>
    </nav>

    <h1>Bienvenue sur LegacyAW FA RP</h1>

    <p>
      Pour en savoir plus, nous t'invitons à rejoindre le discord
    </p>

    <a href="https://discord.gg/m5zA9YfekB" class="btn-discord" target="_blank">
      Rejoindre le Discord
    </a>

    <footer>
      © 2025 LegacyAW FA RP — Tous droits réservés
    </footer>

  </div>

</body>
</html>
