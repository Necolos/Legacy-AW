<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>LegacyAW FA Roleplay</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family: "Inter", sans-serif;
  background:
    radial-gradient(circle at 70% 30%, #ff8c0055, transparent 60%),
    linear-gradient(to bottom, #140700, #000);
  color:#fff3e0;
  min-height:100vh;
  overflow:hidden;
}

/* NAVBAR */
nav{
  position:fixed;
  top:0;
  width:100%;
  padding:25px 70px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:rgba(20,5,0,0.75);
  backdrop-filter:blur(10px);
  border-bottom:1px solid #ff8c0044;
  z-index:1000;
}

nav .logo{
  font-size:1.6rem;
  font-weight:700;
  letter-spacing:2px;
  color:#ff8c00;
}

nav ul{
  list-style:none;
  display:flex;
  gap:40px;
}

nav ul a{
  text-decoration:none;
  color:#ffd6a3;
  font-size:0.9rem;
  letter-spacing:1px;
  text-transform:uppercase;
  transition:0.3s;
}

nav ul a:hover{
  color:#ff8c00;
}

/* HERO */
.hero{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 8%;
}

/* IMAGE PERSO */
.hero-image{
  flex:1;
  height:100vh;
  background:url("images/perso.png") bottom center / contain no-repeat;
  filter: drop-shadow(0 0 40px #ff8c00);
}

/* CONTENU */
.hero-content{
  flex:1;
  max-width:500px;
}

.hero h1{
  font-size:3.6rem;
  margin-bottom:20px;
  letter-spacing:2px;
}

.hero h1 span{
  color:#ff8c00;
}

.hero p{
  color:#ffb86b;
  font-size:1.05rem;
  line-height:1.7;
  margin-bottom:40px;
}

/* BOUTON */
.btn-main{
  display:inline-block;
  padding:16px 55px;
  background:linear-gradient(135deg,#ff8c00,#ffb347);
  color:white;
  text-decoration:none;
  font-weight:700;
  letter-spacing:3px;
  border-radius:5px;
  box-shadow:0 0 30px #ff8c0099;
  transition:0.3s;
}

.btn-main:hover{
  transform:translateY(-3px);
  box-shadow:0 0 45px #ffb347;
}

/* FOOTER */
footer{
  position:absolute;
  bottom:20px;
  width:100%;
  text-align:center;
  color:#c17a2b;
  font-size:0.8rem;
}

/* RESPONSIVE */
@media(max-width:900px){
  .hero{
    flex-direction:column;
    justify-content:center;
    text-align:center;
  }

  .hero-image{
    height:45vh;
    background-position:center;
  }

  .hero-content{
    max-width:90%;
  }
}
</style>
</head>

<body>

<nav>
  <div class="logo">LegacyAW</div>
  <ul>
    <a href="index.html">Accueil</a>
    <a href="server.html">Serveur</a>
    <a href="reglements.html">Règlements</a>
    <a href="streamer.html">Streamer</a>
    <a href="boutique.html">Boutique</a>
  </ul>
</nav>

<section class="hero">

  <div class="hero-image"></div>

  <div class="hero-content">
    <h1><span>LegacyAW</span><br>FA Roleplay</h1>

    <p>
      Un serveur FiveM immersif nouvelle génération.  
      Factions, gangs, entreprises, RP sérieux et économie réaliste.  
      Ta nouvelle vie commence maintenant.
    </p>

    <a href="https://discord.gg/m5zA9YfekB" class="btn-main">PLAY</a>
  </div>

</section>

<footer>
  © 2026 LegacyAW FA Roleplay — Tous droits réservés
</footer>

</body>
</html>
